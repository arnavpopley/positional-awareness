[project]
name = "positional-awareness"
version = "0.1.0"
description = "Stay involved with holdings without re-learning the business."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
pos = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
